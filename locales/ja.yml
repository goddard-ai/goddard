experiments.action_predictions_description: アシスタントのターンが終わると、評価モデルが固定の候補セット（フォローアッププロンプト、Git 操作、セッション管理）から次の行動を予測し、ローカルの行動ジャーナルが各予測を解決します。まだ候補は表示されません — まず正確度を測るため、判定結果は ~/.goddard/action-predictions.jsonl に記録されます。
experiments.action_predictions_title: 行動予測
experiments.automations_description: プロンプトをタイマーで実行するオートメーションページです — 毎時、毎日、平日、毎週、cron。それぞれを独立したタスクまたは既存タスクで実行し、実行履歴と手動の単発実行に対応します。
experiments.automations_title: オートメーション
experiments.big_picture_description: ⌘0 で全ウインドウのセッションカードグリッドを表示します。ライブトランスクリプトとカードごとの入力欄を備え、⌘1–9 で宛先を指定できます。
experiments.big_picture_title: 全体表示
experiments.computer_use_description: コンピュータ操作の設定ページを表示し、同梱のヘルパーを通じてセッションが Cua Driver のキャプチャと入力を操作できるようにします。オフにするとコンピュータ操作自体もオフになります。
experiments.computer_use_title: コンピュータ操作
experiments.composer_drafts_description: 未完成の入力欄テキストと添付ファイルを、セッションやデバイスをまたいで保存して復元します。
experiments.composer_drafts_title: 入力欄の下書き
experiments.friends_description: 設定 → フレンドのページです — フレンド間のファイル転送。フレンドコードを共有し、受信リクエストを承認し、サイドバーのフッターのリングで転送の進行を確認できます。
experiments.friends_title: フレンド
experiments.gate_body: これらは未完成の機能です。バグがあり、予告なく変更または削除される可能性があり、最悪の場合データを破損する可能性があります。内容を理解している場合を除き、オフのままにしておくのがおすすめです。
experiments.gate_confirm: リスクを理解しました — 実験的機能を表示
experiments.gate_title: 実験的機能は不具合を起こす可能性があります
experiments.git_panel_description: セッションの横に ⌘⌥G で開くパネルです。コミットグラフ、展開できる差分、upstream の追跡、ワークツリーをベースに取り込む /land コマンドを備えます。
experiments.git_panel_title: Git パネル
experiments.github_description: プロジェクトの GitHub Issue とプルリクエストを閲覧し、そこからタスクを開始し、チェックとレビューの状態をサイドバーの行と右パネルで確認できます。
experiments.github_title: GitHub 連携
experiments.group_git: Git とレビュー
experiments.group_sessions: セッションとエージェント
experiments.group_surfaces: アプリの画面
experiments.guided_reading_description: トランスクリプトの本文で各単語の先頭の文字を太字にして視線を誘導します。ラテン文字の本文のみに適用され、コード・数式・等幅テキストは変更されません。
experiments.guided_reading_fixation: フィクセーション
experiments.guided_reading_opacity: 不透明度
experiments.guided_reading_saccade: サッカード
experiments.guided_reading_title: ガイデッドリーディング
experiments.integrations_description: 設定 → 連携ページで Linear、GitHub、Notion、Stripe などの公式リモート MCP サーバーを一度接続すれば、Goddard のローカルプロキシを通じて有効なすべてのエージェントに提供されます。
experiments.integrations_title: MCP 連携
experiments.memory_description: 各プロジェクトに永続メモリを持たせます。完了したセッションは .goddard/memory ストアに蒸留され、次のセッションの最初のプロンプトがそれを引き継ぎます — 決定、好み、失敗したアプローチも含まれます。
experiments.memory_title: プロジェクトメモリ
experiments.memory_models_caption: 各プロバイダーの終了したセッションをメモリに蒸留するモデル — バックグラウンド実行のため、高価なインタラクティブ用のモデルは適用されません。ここで選ばない限りプロバイダーのデフォルトを使用します。
experiments.memory_model_default: プロバイダーのデフォルト
experiments.model_router_description: モデル選択に「自動」を追加します。タスクの最初のプロンプトを評価モデルが分類し、ルーティングポリシーのプロバイダーとモデルに振り分けます。
experiments.model_router_title: 自動モデルルーティング
experiments.needs_eval_backend: 評価バックエンドを使用します — まだ構成されていません。
experiments.open_jev_settings: Jev 設定を開く
experiments.phase_routing_description: 計画フェーズが必要と評価モデルが判定した自動振り分けタスクは、最上位クラスのモデルで開始し、ツールイベントまたは評価モデルが計画の終了を判断した時点で1クラス下のモデルに切り替えます — 実装が停滞した場合は元に戻ります。サイドバーの行にタスクのフェーズを表示します。
experiments.phase_routing_title: フェーズ対応ルーティング
experiments.project_map_description: 新しいセッションにワークスペースのコンパクトな構造マップを渡します — 最も参照されるファイルのトップレベルシンボルを約 1,000 トークンに収め、エージェントが初見のリポジトリ探索を省けます。有効化後に開始したセッションに適用されます。
experiments.project_map_title: プロジェクトマップ
experiments.projects_page_description: ⌘⇧P でプロジェクトごとのページを開き、ワークツリー、ブランチ、Issue、プルリクエストを一覧します。⌘⌥1–4 でタブに直接移動できます。
experiments.projects_page_title: プロジェクトページ
experiments.review_queue_description: プロジェクトページにレビュータブを追加します。レビュー用ブランチの提案コミットを古い順に表示し、コミットごとの承認、却下とリバート、承認済み範囲のリリースタスクを開始できます。ブランチ名は「設定 → デーモン」で変更でき、初期値は dev です。
experiments.review_queue_title: QA レビュー
experiments.sandbox_description: 入力欄のアクセスメニューに環境の選択肢（この Mac または分離された Linux VM でタスクを実行）を表示し、セッションヘッダーにサンドボックスバッジを付けます。有効化後に開始したセッションに適用されます。
experiments.sandbox_title: サンドボックス VM
experiments.sidebar_dock_description: ホバーでサイドバーのフッターの上に現れるクイックアクションドックです — 受信トレイ、アーカイブ、キーボードショートカット、設定にワンクリックでアクセスできます。
experiments.sidebar_dock_title: サイドバードック
experiments.status_markers_description: アシスタントのターンが終わると、評価モデルが固定のマーカーセット（完了、入力待ち、未検証、一部完了、ブロック中、失敗、脱線）で採点し、しきい値を超えたマーカーが応答の下にチップとして表示されます。
experiments.status_markers_title: ターンステータスマーカー
experiments.subagents_description: セッションが実行を名前付きサブエージェントに委任できるようにします。Claude Code、OpenCode、GitHub Copilot、Pi は完全対応、Codex と OpenCode 2 は助言のみ、それ以外のプロバイダーでは無効です。読み取り専用ヘルパーの強制は、ツールポリシーを提供するプロバイダーに限られます。有効化後に開始したセッションに適用されます。
experiments.subagents_title: サブエージェント
experiments.voice_briefing_title: 音声ブリーフィング
experiments.voice_briefing_description: 最新の返信が長いタスクを開くと、約45秒の要約を読み上げます — エージェントが行ったことと、あなたに必要な判断や対応を伝えます。AI Gateway キーと以下のモデルで実行されます。
experiments.voice_briefing_caption: どちらの呼び出しも AI Gateway を経由します — 要約モデルが原稿を作成し、音声モデルがそれを読み上げます。キーはこのアプリの設定ファイルに保存されます。
