experiments.action_predictions_description: 助手轮次结束后，评估模型会从固定候选集（后续提示词、Git 操作、会话管理）中预测你的下一步，本地的行为日志会逐条核销每个预测。暂不会显示建议 — 判定结果先记录到 ~/.goddard/action-predictions.jsonl 以衡量准确度。
experiments.action_predictions_title: 行为预测
experiments.automations_description: 新增“自动化”页面，可按计划定时运行提示词 — 每小时、每天、工作日、每周或 cron — 每次运行可作为独立任务或进入现有任务，并带有运行历史和单次手动运行。
experiments.automations_title: 自动化
experiments.big_picture_description: 按 ⌘0 打开全窗口的会话卡片网格，带实时转录、每张卡片的输入框，以及 ⌘1–9 选定。
experiments.big_picture_title: 概览
experiments.computer_use_description: 显示“电脑操作”设置页，并让会话通过内置助手驱动 Cua Driver 的截屏与输入。关闭此项会同时关闭电脑操作本身。
experiments.computer_use_title: 电脑操作
experiments.friends_description: 新增“设置 → 好友”页面，用于好友间文件传输 — 分享你的好友码、接受传入请求，并从侧边栏底部的圆环查看实时传输进度。
experiments.friends_title: 好友
experiments.gate_body: 这些是未完成功能。它们可能有缺陷、随时变更或移除，最坏情况下可能损坏你的数据。除非你知道自己在做什么，否则最好保持关闭。
experiments.gate_confirm: 我已了解风险 — 显示实验功能
experiments.gate_title: 实验功能可能导致问题
experiments.git_panel_description: 在会话旁新增 ⌘⌥G 面板，包含提交图谱、可展开的差异、上游跟踪，以及将工作树合入其基准分支的 /land 命令。
experiments.git_panel_title: Git 面板
experiments.github_description: 浏览项目的 GitHub issue 和拉取请求，从中启动任务，并在侧边栏行和右侧面板中查看检查与审查状态。
experiments.github_title: GitHub 集成
experiments.group_git: Git 与审查
experiments.group_sessions: 会话与智能体
experiments.group_surfaces: 应用界面
experiments.guided_reading_description: 将转录正文中每个单词的开头字母加粗以引导视线。仅适用于拉丁字母文本；代码、数学公式和等宽文本不受影响。
experiments.guided_reading_fixation: 注视强度
experiments.guided_reading_opacity: 不透明度
experiments.guided_reading_saccade: 眼跳间隔
experiments.guided_reading_title: 引导式阅读
experiments.integrations_description: 新增“设置 → 集成”页面，一次连接 Linear、GitHub、Notion、Stripe 等官方远程 MCP 服务器，并通过 Goddard 的本地代理提供给每个已启用的智能体。
experiments.integrations_title: MCP 集成
experiments.memory_description: 为每个项目提供持久记忆。已完成的会话会被提炼进 .goddard/memory 存储，下一个会话的首条提示词会携带它 — 包括决策、偏好和失败的尝试。
experiments.memory_title: 项目记忆
experiments.memory_models_caption: 用于将各服务商已完成的会话提炼进记忆的模型 — 在后台运行，因此不会套用为交互式选择的高价模型。除非在此另行选择，否则使用服务商默认值。
experiments.memory_model_default: 服务商默认值
experiments.model_router_description: 在模型选择器中新增“自动”。任务的第一个提示词由评估模型分类，然后按你的路由策略路由到某个服务商和模型。
experiments.model_router_title: 自动模型路由
experiments.needs_eval_backend: 使用评估后端 — 尚未配置。
experiments.open_jev_settings: 打开 Jev 设置
experiments.phase_routing_description: 评估模型判定需要规划阶段的自动路由任务，先用最强档模型启动，待工具流或评估模型判定规划结束后降一档切换模型 — 实现停滞时会切回。侧边栏任务行显示当前阶段。
experiments.phase_routing_title: 分阶段路由
experiments.project_map_description: 为每个新会话提供一份工作区的紧凑结构地图 — 最常被引用文件的顶层符号，预算约 1,000 个令牌 — 让智能体跳过冷启动的仓库探索。对开启后启动的会话生效。
experiments.project_map_title: 项目地图
experiments.projects_page_description: 按 ⌘⇧P 打开每个项目的页面，列出其工作树、分支、issue 和拉取请求，⌘⌥1–4 可直接跳转到对应标签页。
experiments.projects_page_title: 项目页面
experiments.review_queue_description: 在项目页面新增“审查”标签页，按从旧到新列出审查分支的提议提交，支持逐个批准、拒绝并回退，以及为已批准的范围启动发布任务。分支名可在“设置 → 守护进程”中配置，默认为 dev。
experiments.review_queue_title: QA 审查
experiments.sandbox_description: 在输入框的访问菜单中显示环境选择 — 在这台 Mac 或隔离的 Linux VM 中运行任务 — 并在会话标题上显示“沙箱中”徽标。对开启后启动的会话生效。
experiments.sandbox_title: 沙箱 VM
experiments.sidebar_dock_description: 一个悬停时在侧边栏底部升起的快捷操作坞 — 收件箱、归档、键盘快捷键和设置一键可达。
experiments.sidebar_dock_title: 侧边栏操作坞
experiments.status_markers_description: 当助手轮次结束时，评估模型会按固定标记集为其打分 — 已完成、等待输入、未验证、部分完成、受阻、失败、已偏离 — 达到阈值的标记会以标签形式显示在回复下方。
experiments.status_markers_title: 轮次状态标记
experiments.subagents_description: 让会话把运行委派给具名子智能体，支持按服务商分档和带成本标注的路由，并在转录中清晰展示。对开启后启动的会话生效。
experiments.subagents_title: 子智能体
experiments.voice_briefing_title: 语音简报
experiments.voice_briefing_description: 打开最新回复较长的任务时，朗读约 45 秒的摘要 — 先讲智能体做了什么，再讲需要你做的决定或处理。使用你的 AI Gateway 密钥和下方模型运行。
