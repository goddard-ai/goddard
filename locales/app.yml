  en: External daemon
daemon.external_description:
  en: This desktop is connected to a daemon managed outside Goddard. Configure its listener, browser origins, and token on that host.
daemon.web_external_description:
  en: Goddard Web connects to a daemon managed outside this browser. Configure its listener, browser origins, and token on that host.
daemon.web_connection_description:
  en: This browser never starts or stops the daemon.
daemon.agent_tools_title:
  en: Agent tools
daemon.agent_tools_description:
  en: Let an agent create tasks and send messages to other tasks. Sessions started while this is on get a session-scoped goddard-agent command; prompts it sends are marked in the target transcript.
daemon.agent_settings_title:
  en: Agent settings
daemon.agent_settings_description:
  en: Let agents create and edit custom commands for you. On by default; commands an agent adds are marked, and the daemon records which task made each change.
daemon.sandbox_default_title:
  en: Sandbox new tasks by default
daemon.sandbox_default_description:
  en: Start fresh tasks in the Sandbox VM environment instead of This Mac. A task's own Environment choice still wins for that task.
daemon.build_title:
  en: Build
daemon.build_description:
  en: The commits this app and the connected daemon were built from.
daemon.build_app:
  en: App
daemon.build_daemon:
  en: Daemon
experiments.big_picture_title:
  en: Big Picture
experiments.big_picture_description:
  en: Press ⌘0 for a full-window grid of session cards with live transcripts, per-card composers, and ⌘1–9 arming.
experiments.git_panel_title:
  en: Git panel
experiments.git_panel_description:
  en: A ⌘⌥G panel beside the session with the commit graph, expandable diffs, upstream tracking, and a /land command to land a worktree on its base.
experiments.github_title:
  en: GitHub integration
experiments.github_description:
  en: Browse a project's GitHub issues and pull requests, start tasks from them, and see check and review status on sidebar rows and in the right panel.
experiments.projects_page_title:
  en: Projects page
experiments.projects_page_description:
  en: Press ⌘⇧P for a per-project page listing its worktrees, branches, issues, and pull requests, with ⌘⌥1–4 jumping straight to a tab.
experiments.review_queue_title:
  en: QA review
experiments.review_queue_description:
  en: Add a Review tab to the Projects page — the qa branch's proposed commits listed oldest first, with per-commit approve, reject-and-revert, and a promote control for the approved frontier.
experiments.subagents_title:
  en: Subagents
experiments.subagents_description:
  en: Let a session delegate runs to named subagents with per-provider tiers and cost-labeled routing, shown legibly in the transcript. Applies to sessions started after turning it on.
experiments.computer_use_title:
  en: Computer Use
experiments.computer_use_description:
  en: Reveal the Computer Use settings page and let sessions drive Cua Driver capture and input through the bundled helper. Turning it off also turns Computer Use itself off.
experiments.friends_title:
  en: Friends
experiments.friends_description:
  en: A Settings → Friends page for friend-to-friend file transfers — share your friend code, accept incoming requests, and watch live transfer progress from a sidebar footer ring.
experiments.integrations_title:
  en: MCP integrations
experiments.integrations_description:
  en: A Settings → Integrations page for connecting official remote MCP servers — Linear, GitHub, Notion, Stripe, and more — once, and delivering them to every enabled agent through Goddard's local proxy.
experiments.model_router_title:
  en: Auto model routing
experiments.model_router_description:
  en: Add Auto to the model picker. A task's first prompt is classified by the evaluation model, then routed to a provider and model from your routing policy.
experiments.status_markers_title:
  en: Turn status markers
experiments.status_markers_description:
  en: When an assistant turn ends, the evaluation model scores it against a fixed marker set — complete, awaiting input, unverified, partial, blocked, failed, drifted — and markers that clear their threshold appear as chips under the response.
experiments.sidebar_dock_title:
  en: Sidebar dock
experiments.sidebar_dock_description:
  en: A quick-action dock that rises above the sidebar footer on hover — inbox, archive, keyboard shortcuts, and settings one click away.
experiments.guided_reading_title:
  en: Guided reading
experiments.guided_reading_description:
  en: Bold the leading letters of each word in transcript prose to guide the eye — the emphasis pattern known as bionic reading. Applies to Latin-script prose only; code, math, and monospace text are untouched.
experiments.guided_reading_fixation:
  en: Fixation
experiments.guided_reading_saccade:
