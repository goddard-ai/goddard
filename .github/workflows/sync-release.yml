name: Sync final R2 compatibility bridge

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Final transition release tag to sync to the legacy R2 bridge
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync final release to R2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            echo "::error::No release tag provided"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag such as v0.12.0"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # This one-time bridge only applies to the final stable release.
          prerelease=$(gh release view "$tag" --repo "${{ github.repository }}" \
            --json isPrerelease --jq .isPrerelease)
          if [ "$prerelease" = "true" ]; then
            echo "::error::The R2 compatibility bridge accepts stable releases only"
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install --yes rclone

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p assets
          gh release download "$RELEASE_TAG" \
            --dir assets \
            --repo "${{ github.repository }}"
          if [ -z "$(ls -A assets)" ]; then
            echo "::error::Release $RELEASE_TAG has no assets"
            exit 1
          fi
          ls -lah assets

      - name: Rewrite appcasts for existing installs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = "https://github.com/goddard-ai/goddard/releases/download/"
          pattern = re.compile(re.escape(source) + r"[^/]+/")
          target = "https://releases.goddardai.org/"
          feeds = sorted(Path("assets").glob("appcast*.xml"))
          if not feeds:
              raise SystemExit("release has no appcast assets")
          for feed in feeds:
              text = feed.read_text()
              rewritten, count = pattern.subn(target, text)
              if source in rewritten:
                  raise SystemExit(f"could not rewrite all GitHub URLs in {feed}")
              if count == 0:
                  raise SystemExit(f"no GitHub release URLs found in {feed}")
              feed.write_text(rewritten)
              print(f"Rewrote {count} URL(s) in {feed}")
          PY

      - name: Upload assets to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.RELEASES_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          bucket="${R2_BUCKET:-goddard-releases}"
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export RCLONE_CONFIG_R2_ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          destination="r2:${bucket}"
          immutable="Cache-Control: public, max-age=31536000, immutable"
          fresh="Cache-Control: public, max-age=300, must-revalidate"

          rclone copy assets "$destination" \
            --s3-no-check-bucket \
            --exclude appcast.xml \
            --exclude latest-linux.txt \
            --exclude latest-windows.txt \
            --exclude 'appcast-linux-*.xml' \
            --exclude 'appcast-windows-*.xml' \
            --header-upload "$immutable" \
            --progress

          for pointer in appcast.xml appcast-linux-x86_64.xml \
            appcast-linux-aarch64.xml appcast-windows-x86_64.xml \
            appcast-windows-aarch64.xml latest-linux.txt latest-windows.txt; do
            if [ -f "assets/$pointer" ]; then
              rclone copyto "assets/$pointer" "${destination}/${pointer}" \
                --s3-no-check-bucket \
                --header-upload "$fresh" \
                --progress
            fi
          done
