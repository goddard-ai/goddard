name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Ubuntu runs on every push and PR. macOS and Windows cost 20-40 minutes
    # each, so they run on pushes to main, or on PRs carrying the `macos` /
    # `windows` label.
    if: >-
      matrix.os == 'ubuntu-24.04' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        ((matrix.os == 'macos-latest' && contains(github.event.pull_request.labels.*.name, 'macos')) ||
         (matrix.os == 'windows-latest' && contains(github.event.pull_request.labels.*.name, 'windows'))))
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      # sccache caches per-crate compilation units, so it keeps hitting across
      # Cargo.lock churn — the raw target/ cache missed on every dependency
      # bump and cost multiple GiB of restore I/O on Windows besides.
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      - name: Run tests
        run: cargo test --locked

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test
