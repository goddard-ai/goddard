name: Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # sccache storage lives in the goddard-ci-cache R2 bucket: GitHub's
      # 10 GiB Actions cache cap was evicting entries between runs.
      SCCACHE_BUCKET: goddard-ci-cache
      SCCACHE_REGION: auto
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Runs without secrets (forked PRs) fall back to the GHA cache backend.
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID == '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-x11-dev \
            mold \
            pkg-config \
            xdg-desktop-portal

      # sccache caches per-crate compilation units, so it keeps hitting across
      # Cargo.lock churn — the raw target/ cache missed on every dependency
      # bump and cost multiple GiB of restore I/O on Windows besides.
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      # Same linkers the release build uses, exercised on every push so a
      # linker incompatibility fails here instead of during a release.
      - name: Run tests
        env:
          RUSTFLAGS: ${{ (runner.os == 'Linux' && '-C linker=clang -C link-arg=-fuse-ld=mold') || (runner.os == 'Windows' && '-C linker=rust-lld') || '' }}
        run: cargo test --locked

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test
