name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      # sccache storage lives in the goddard-ci-cache R2 bucket: GitHub's
      # 10 GiB Actions cache cap was evicting entries between runs.
      SCCACHE_BUCKET: goddard-ci-cache
      SCCACHE_REGION: auto
      SCCACHE_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_S3_USE_SSL: "true"
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_R2_SECRET_ACCESS_KEY }}
      # Runs without secrets (forked PRs) fall back to the GHA cache backend.
      SCCACHE_GHA_ENABLED: ${{ secrets.SCCACHE_R2_ACCESS_KEY_ID == '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-x11-dev \
            mold \
            pkg-config \
            python3 \
            xdg-desktop-portal

      # sccache caches per-crate compilation units, so it keeps hitting across
      # Cargo.lock churn — the raw target/ cache missed on every dependency
      # bump and cost multiple GiB of restore I/O on Windows besides.
      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache Cargo downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      # Same linkers the release build uses, exercised on every push so a
      # linker incompatibility fails here instead of during a release.
      - name: Run tests
        env:
          RUSTFLAGS: ${{ (runner.os == 'Linux' && '-C linker=clang -C link-arg=-fuse-ld=mold') || (runner.os == 'Windows' && '-C linker=rust-lld') || '' }}
        run: cargo test --workspace --locked

      # The generated protocol and TypeScript suites are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and TypeScript suites
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun test ./packages/waku-client ./apps/web ./apps/mobile

      - name: Check release automation
        if: runner.os == 'Linux'
        run: bun test ./.github/scripts

  release-metadata:
    name: Release metadata
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/next') ||
      (github.event.pull_request.head.ref == 'release/next' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Require an unused version and folded changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version"
          # Query the tag list successfully before checking absence: an API
          # outage or auth error must fail rather than look like an unused tag.
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" > tags.json
          VERSION="$version" python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = "refs/tags/v" + os.environ["VERSION"]
          assert not any(item["ref"] == tag for item in json.loads(Path("tags.json").read_text())), "Version tag already exists"
          assert not any(Path(".changelog").glob("*.md")), "Fold desktop changelog fragments before merging"
          assert not any(Path(".changelog/mobile").glob("*.md")), "Fold mobile changelog fragments before merging"
          PY

  release-checks:
    name: Release checks
    if: always()
    needs: [test, release-metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete test matrix
        env:
          RESULT: ${{ needs.test.result }}
          METADATA: ${{ needs.release-metadata.result }}
          IS_RELEASE: ${{ github.event.pull_request.head.ref == 'release/next' || github.ref == 'refs/heads/release/next' }}
        run: |
          test "$RESULT" = success
          if [ "$IS_RELEASE" = true ]; then
            test "$METADATA" = success
          fi
