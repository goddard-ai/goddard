<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1560" viewBox="0 0 1760 1560" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .frame { fill: #fafafa; stroke: #b5b5b5; stroke-width: 1.5; }
      .chrome { fill: #f0f0f0; stroke: #cfcfcf; stroke-width: 1; }
      .sidebar { fill: #f4f4f4; stroke: #d8d8d8; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #a8a8a8; stroke-width: 1.5; }
      .row { fill: #ffffff; stroke: #d0d0d0; stroke-width: 1; }
      .row-alt { fill: #efefef; stroke: #d0d0d0; stroke-width: 1; }
      .hover { fill: #e4ecff; stroke: #8fa8e8; stroke-width: 1; }
      .btn { fill: #ffffff; stroke: #909090; stroke-width: 1.2; }
      .btn-primary { fill: #d9e4ff; stroke: #5570c9; stroke-width: 1.2; }
      .btn-danger { fill: #ffe3e3; stroke: #c95555; stroke-width: 1.2; }
      .input { fill: #ffffff; stroke: #a0a0a0; stroke-width: 1.2; }
      .dash { fill: none; stroke: #b8b8b8; stroke-width: 1; stroke-dasharray: 5 4; }
      .bar-track { fill: #ececec; stroke: #c4c4c4; stroke-width: 1; }
      .bar-fill { fill: #9db8ef; stroke: none; }
      .title { font-size: 15px; font-weight: 700; fill: #222; }
      .label { font-size: 12px; font-weight: 600; fill: #444; }
      .section { font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; fill: #888; }
      .text { font-size: 12px; fill: #333; }
      .small { font-size: 10.5px; fill: #777; }
      .tiny { font-size: 9.5px; fill: #999; }
      .mono { font-family: 'SF Mono', Menlo, monospace; font-size: 11px; fill: #333; }
      .scr { font-size: 17px; font-weight: 800; fill: #333; }
      .scrn { font-size: 11px; font-weight: 700; fill: #fff; }
      .num { fill: #555; }
      .online { fill: #3fa45b; }
      .offline { fill: #b5b5b5; }
      .arrow { stroke: #909090; stroke-width: 1.4; fill: none; marker-end: url(#ah); }
    </style>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#909090"/>
    </marker>
  </defs>

  <rect width="1760" height="1560" fill="#e9e9e9"/>
  <text x="40" y="40" class="scr">Goddard — Friends &amp; File Sharing wireframe</text>
  <text x="40" y="62" class="small">All surfaces in-app. Friend = confirmed iroh NodeId keypair. No browser, no links.</text>

  <!-- ============ SCREEN 1: Sidebar with FRIENDS section ============ -->
  <g transform="translate(40,90)">
    <text x="0" y="-10" class="title">1 · Sidebar — FRIENDS section</text>
    <rect class="frame" x="0" y="0" width="800" height="560" rx="10"/>
    <!-- titlebar -->
    <rect class="chrome" x="0" y="0" width="800" height="34" rx="10"/>
    <line x1="0" y1="34" x2="800" y2="34" stroke="#cfcfcf"/>
    <circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="40" cy="17" r="5.5" fill="#febc2e"/><circle cx="60" cy="17" r="5.5" fill="#28c840"/>
    <text x="400" y="21" class="tiny" text-anchor="middle">goddard · filepizza-demo</text>
    <!-- sidebar -->
    <rect class="sidebar" x="0" y="34" width="240" height="526"/>
    <rect class="input" x="12" y="46" width="216" height="26" rx="6"/>
    <text x="24" y="63" class="tiny">⌕ Search</text>
    <rect class="row-alt" x="10" y="80" width="220" height="28" rx="6"/>
    <text x="22" y="98" class="text">＋ New session</text>
    <text x="14" y="128" class="section">PINNED</text>
    <rect class="row" x="10" y="136" width="220" height="26" rx="5"/>
    <text x="22" y="153" class="text">◔ fix login redirect</text>
    <text x="14" y="180" class="section">FILEPIZZA-DEMO</text>
    <rect class="row" x="10" y="188" width="220" height="26" rx="5"/>
    <text x="22" y="205" class="text">◔ add webrtc spike</text>
    <rect class="row" x="10" y="218" width="220" height="26" rx="5"/>
    <text x="22" y="235" class="text">◔ explore iroh</text>

    <!-- FRIENDS section -->
    <rect x="6" y="252" width="228" height="196" rx="8" fill="none" stroke="#5570c9" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="14" y="272" class="section">FRIENDS</text>
    <rect class="btn" x="196" y="258" width="32" height="20" rx="5"/>
    <text x="212" y="272" class="text" text-anchor="middle">＋</text>
    <text x="240" y="272" class="tiny">add</text>

    <!-- friend row: online -->
    <rect class="row" x="10" y="282" width="220" height="40" rx="6"/>
    <circle cx="28" cy="302" r="11" fill="#dcdcdc" stroke="#bbb"/>
    <circle cx="35" cy="309" r="4" class="online" stroke="#fff"/>
    <text x="48" y="298" class="text">maya</text>
    <text x="48" y="312" class="tiny">online</text>

    <!-- friend row: hover revealing actions -->
    <rect class="hover" x="10" y="328" width="220" height="40" rx="6"/>
    <circle cx="28" cy="348" r="11" fill="#dcdcdc" stroke="#bbb"/>
    <circle cx="35" cy="355" r="4" class="online" stroke="#fff"/>
    <text x="48" y="344" class="text">ren</text>
    <text x="48" y="358" class="tiny">online</text>
    <rect class="btn" x="150" y="336" width="72" height="16" rx="4"/>
    <text x="186" y="348" class="tiny" text-anchor="middle">⇪ Send file…</text>
    <rect class="btn" x="150" y="354" width="72" height="12" rx="4"/>
    <text x="186" y="363" class="tiny" text-anchor="middle">⌫ Remove</text>

    <!-- friend row: offline -->
    <rect class="row" x="10" y="374" width="220" height="40" rx="6"/>
    <circle cx="28" cy="394" r="11" fill="#dcdcdc" stroke="#bbb"/>
    <circle cx="35" cy="401" r="4" class="offline" stroke="#fff"/>
    <text x="48" y="390" class="text">jules</text>
    <text x="48" y="404" class="tiny">offline — send disabled</text>

    <!-- active transfer chip pinned under friends -->
    <rect class="card" x="10" y="422" width="220" height="22" rx="5"/>
    <rect class="bar-track" x="18" y="430" width="120" height="6" rx="3"/>
    <rect class="bar-fill" x="18" y="430" width="72" height="6" rx="3"/>
    <text x="146" y="437" class="tiny">design.pdf 62%</text>

    <!-- main area -->
    <rect class="dash" x="252" y="46" width="536" height="480" rx="8"/>
    <text x="520" y="290" class="small" text-anchor="middle">transcript (unchanged)</text>
  </g>

  <!-- ============ SCREEN 2: Add Friend dialog ============ -->
  <g transform="translate(940,90)">
    <text x="0" y="-10" class="title">2 · Add Friend dialog</text>
    <rect class="frame" x="0" y="0" width="780" height="560" rx="10"/>
    <rect class="dash" x="16" y="16" width="748" height="528" rx="8"/>
    <rect class="card" x="200" y="120" width="380" height="330" rx="10"/>
    <text x="220" y="152" class="label">Add friend</text>
    <text x="220" y="172" class="small">Friends are verified by key — no accounts.</text>

    <text x="220" y="200" class="tiny">YOUR FRIEND CODE</text>
    <rect class="input" x="220" y="208" width="260" height="30" rx="6"/>
    <text x="232" y="228" class="mono">gfr-7F3K-9MQ2-X8AD-PL4T</text>
    <rect class="btn" x="490" y="208" width="70" height="30" rx="6"/>
    <text x="525" y="228" class="text" text-anchor="middle">⧉ Copy</text>
    <text x="220" y="256" class="tiny">share this out of band — iMessage, slack, in person</text>

    <line x1="220" y1="276" x2="560" y2="276" stroke="#ddd"/>
    <text x="390" y="280" class="tiny" text-anchor="middle" fill="#e9e9e9" stroke="none">or</text>

    <text x="220" y="302" class="tiny">THEIR FRIEND CODE</text>
    <rect class="input" x="220" y="310" width="340" height="30" rx="6"/>
    <text x="232" y="330" class="mono" fill="#aaa">gfr-…</text>

    <rect class="btn" x="340" y="368" width="100" height="30" rx="6"/>
    <text x="390" y="388" class="text" text-anchor="middle">Cancel</text>
    <rect class="btn-primary" x="450" y="368" width="110" height="30" rx="6"/>
    <text x="505" y="388" class="text" text-anchor="middle">Send request</text>
    <text x="220" y="428" class="tiny">Esc closes · ⌘V pastes · request pending until they accept</text>
  </g>

  <!-- ============ SCREEN 3: Incoming friend request ============ -->
  <g transform="translate(40,720)">
    <text x="0" y="-10" class="title">3 · Incoming friend request (toast card, top-right of main pane)</text>
    <rect class="frame" x="0" y="0" width="500" height="240" rx="10"/>
    <rect class="dash" x="12" y="12" width="476" height="216" rx="8"/>
    <rect class="card" x="120" y="30" width="360" height="180" rx="10"/>
    <text x="140" y="58" class="label">Friend request</text>
    <circle cx="152" cy="84" r="11" fill="#dcdcdc" stroke="#bbb"/>
    <text x="174" y="89" class="text"><tspan font-weight="700">maya</tspan> wants to add you</text>
    <text x="140" y="118" class="tiny">VERIFY KEY — compare in person / other channel</text>
    <rect class="input" x="140" y="126" width="320" height="24" rx="5"/>
    <text x="150" y="143" class="mono">🍕🌮🎧🛰️🌵  7F3K-9MQ2</text>
    <rect class="btn-danger" x="236" y="164" width="104" height="28" rx="6"/>
    <text x="288" y="183" class="text" text-anchor="middle">Decline</text>
    <rect class="btn-primary" x="350" y="164" width="110" height="28" rx="6"/>
    <text x="405" y="183" class="text" text-anchor="middle">Accept</text>
  </g>

  <!-- ============ SCREEN 4: Send flow states ============ -->
  <g transform="translate(570,720)">
    <text x="0" y="-10" class="title">4 · Send flow — friend row card (sender side)</text>
    <rect class="frame" x="0" y="0" width="560" height="240" rx="10"/>
    <rect class="dash" x="12" y="12" width="536" height="216" rx="8"/>

    <!-- state a: waiting -->
    <rect class="card" x="30" y="26" width="240" height="88" rx="8"/>
    <text x="44" y="48" class="label" font-size="11">⇪ design.pdf</text>
    <text x="44" y="64" class="tiny">14.2 MB → maya</text>
    <circle cx="50" cy="84" r="4" fill="#f0a93c"/>
    <text x="62" y="88" class="small">waiting for maya to accept…</text>
    <text x="212" y="88" class="tiny">cancel</text>

    <!-- state b: transferring -->
    <rect class="card" x="290" y="26" width="240" height="88" rx="8"/>
    <text x="304" y="48" class="label" font-size="11">⇪ design.pdf</text>
    <text x="304" y="64" class="tiny">8.8 / 14.2 MB · 3.1 MB/s · ~2s</text>
    <rect class="bar-track" x="304" y="74" width="160" height="8" rx="4"/>
    <rect class="bar-fill" x="304" y="74" width="99" height="8" rx="4"/>
    <text x="480" y="82" class="tiny">✕</text>

    <!-- state c: done -->
    <rect class="card" x="30" y="128" width="240" height="88" rx="8"/>
    <text x="44" y="150" class="label" font-size="11">⇪ design.pdf</text>
    <text x="44" y="166" class="tiny">14.2 MB → maya</text>
    <circle cx="50" cy="184" r="4" class="online"/>
    <text x="62" y="188" class="small">sent · 4.6s</text>
    <rect class="btn" x="160" y="172" width="90" height="24" rx="5"/>
    <text x="205" y="188" class="tiny" text-anchor="middle">Send another</text>

    <!-- state d: declined/failed -->
    <rect class="card" x="290" y="128" width="240" height="88" rx="8"/>
    <text x="304" y="150" class="label" font-size="11">⇪ design.pdf</text>
    <text x="304" y="166" class="tiny">14.2 MB → maya</text>
    <circle cx="310" cy="184" r="4" fill="#d05555"/>
    <text x="322" y="188" class="small">maya declined</text>
    <rect class="btn" x="450" y="172" width="62" height="24" rx="5"/>
    <text x="481" y="188" class="tiny" text-anchor="middle">Retry</text>
  </g>

  <!-- ============ SCREEN 5: Incoming transfer (receiver) ============ -->
  <g transform="translate(1180,720)">
    <text x="0" y="-10" class="title">5 · Incoming transfer card (receiver side)</text>
    <rect class="frame" x="0" y="0" width="540" height="240" rx="10"/>
    <rect class="dash" x="12" y="12" width="516" height="216" rx="8"/>
    <rect class="card" x="90" y="26" width="420" height="190" rx="10"/>
    <text x="110" y="54" class="label">Incoming file</text>
    <circle cx="122" cy="80" r="11" fill="#dcdcdc" stroke="#bbb"/>
    <text x="144" y="85" class="text"><tspan font-weight="700">maya</tspan> is sending you a file</text>
    <rect class="row" x="110" y="100" width="380" height="40" rx="6"/>
    <text x="124" y="118" class="text">📄 design.pdf</text>
    <text x="124" y="132" class="tiny">14.2 MB · PDF document</text>
    <text x="478" y="118" class="tiny" text-anchor="end">from maya</text>
    <text x="110" y="162" class="tiny">SAVE TO</text>
    <rect class="input" x="164" y="150" width="236" height="24" rx="5"/>
    <text x="174" y="167" class="small">~/Downloads</text>
    <text x="416" y="167" class="tiny">change…</text>
    <rect class="btn-danger" x="272" y="182" width="104" height="28" rx="6"/>
    <text x="324" y="201" class="text" text-anchor="middle">Decline</text>
    <rect class="btn-primary" x="386" y="182" width="104" height="28" rx="6"/>
    <text x="438" y="201" class="text" text-anchor="middle">Accept</text>
  </g>

  <!-- ============ SCREEN 6: Receive progress + command palette ============ -->
  <g transform="translate(40,1010)">
    <text x="0" y="-10" class="title">6 · Receiving progress + completion (receiver row)</text>
    <rect class="frame" x="0" y="0" width="500" height="200" rx="10"/>
    <rect class="dash" x="12" y="12" width="476" height="176" rx="8"/>
    <rect class="card" x="30" y="26" width="440" height="76" rx="8"/>
    <text x="44" y="48" class="label" font-size="11">⇓ design.pdf</text>
    <text x="44" y="64" class="tiny">from maya · 9.1 / 14.2 MB · 3.1 MB/s</text>
    <rect class="bar-track" x="44" y="74" width="330" height="8" rx="4"/>
    <rect class="bar-fill" x="44" y="74" width="211" height="8" rx="4"/>
    <text x="440" y="82" class="tiny">✕</text>
    <rect class="card" x="30" y="112" width="440" height="62" rx="8"/>
    <circle cx="50" cy="138" r="4" class="online"/>
    <text x="62" y="135" class="text">design.pdf — saved to ~/Downloads</text>
    <text x="62" y="150" class="tiny">14.2 MB in 4.6s</text>
    <rect class="btn" x="336" y="130" width="120" height="26" rx="5"/>
    <text x="396" y="147" class="tiny" text-anchor="middle">Show in Finder</text>
  </g>

  <g transform="translate(570,1010)">
    <text x="0" y="-10" class="title">7 · Command palette entries</text>
    <rect class="frame" x="0" y="0" width="560" height="200" rx="10"/>
    <rect class="card" x="90" y="24" width="380" height="150" rx="10"/>
    <rect class="input" x="106" y="40" width="348" height="28" rx="6"/>
    <text x="118" y="59" class="small">friend</text>
    <rect class="hover" x="106" y="76" width="348" height="26" rx="5"/>
    <text x="118" y="94" class="text">Friends: Add Friend…</text>
    <rect class="row" x="106" y="104" width="348" height="26" rx="5"/>
    <text x="118" y="122" class="text">Friends: Send File to maya…</text>
    <rect class="row" x="106" y="132" width="348" height="26" rx="5"/>
    <text x="118" y="150" class="text">Friends: Send File to ren…</text>
  </g>

  <g transform="translate(1180,1010)">
    <text x="0" y="-10" class="title">8 · Keyboard + a11y notes</text>
    <rect class="frame" x="0" y="0" width="540" height="200" rx="10"/>
    <text x="24" y="40" class="small">• Friends rows are tab stops; Enter opens Send file…, ⌫ removes (with confirm)</text>
    <text x="24" y="64" class="small">• Status is icon + text, never color alone (dot + "online"/"offline" label)</text>
    <text x="24" y="88" class="small">• Incoming request/transfer cards grab focus; Esc declines, Enter accepts</text>
    <text x="24" y="112" class="small">• Progress announced by text (MB/s, %), not the bar alone</text>
    <text x="24" y="136" class="small">• All file I/O + iroh on background_executor; cards render from stored state</text>
    <text x="24" y="160" class="small">• Offline friend → Send disabled with reason, not hidden</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,1260)">
    <text x="0" y="0" class="title">Flow</text>
    <text x="0" y="30" class="small">Add friend (2) → paste code → request card on their side (3) → accept → row appears in FRIENDS (1)</text>
    <text x="0" y="54" class="small">Send: row hover "Send file…" → pick file → waiting/progress/done card (4) · Receive: accept card (5) → progress/done (6)</text>
    <text x="0" y="78" class="tiny">Wire: friend code = base32(iroh NodeId pubkey) · QUIC stream, chunked, E2E by default · both must be online</text>
  </g>
</svg>
