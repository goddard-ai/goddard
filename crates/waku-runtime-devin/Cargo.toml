[package]
name = "waku-runtime-devin"
version = "0.1.0"
edition = "2024"
description = "Runtime-owned Devin ACP transport"
license = "GPL-3.0-only"

[dependencies]
agent-client-protocol = "2.0.0"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-runtime = { path = "../waku-runtime" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
