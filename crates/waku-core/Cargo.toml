[package]
name = "waku-core"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Goddard"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
agent-client-protocol = "2.0.0"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
dunce = "1"
futures = "0.3"
# bundled-cli (default) embeds the ~118 MB Copilot CLI archive in the binary;
# the driver always launches the installed `copilot` via CliProgram::Path.
github-copilot-sdk = { version = "1.0.14", default-features = false }
nucleo-matcher = "0.3"
parking_lot = "0.12"
rust-i18n = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
sha2 = "0.10"
smol = "2"
subtle = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.8"
trash = "5.2.6"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-protocol = { path = "../waku-protocol" }
waku-share = { path = "../waku-share" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cron = "0.15"
chrono-tz = "0.10"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-swift = "0.7.3"
ignore = "0.4.33"
mdns-sd = "0.21.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
waku-client = { path = "../waku-client" }
