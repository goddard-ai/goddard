[package]
name = "waku-drivers"
version = "0.1.0"
edition = "2024"
description = "Provider drivers, discovery, integrations, and cloud runtimes for Goddard"
license = "GPL-3.0-only"

[features]
# Fixtures shared with waku-core tests; never enabled by production dependencies.
test-support = []

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
dunce = "1"
futures = "0.3"
github-copilot-sdk = { version = "1.0.14", default-features = false }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smol = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.8"
url = "2"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-base = { path = "../waku-base" }
waku-exec = { path = "../waku-exec" }
waku-git = { path = "../waku-git" }
waku-sessions = { path = "../waku-sessions" }
waku-localization = { path = "../waku-localization" }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
waku-sessions = { path = "../waku-sessions", features = ["test-support"] }
