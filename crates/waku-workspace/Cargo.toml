[package]
name = "waku-workspace"
version = "0.1.0"
edition = "2024"
description = "Workspace operations, composer completion, and skill management for Goddard"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
dirs = "6.0"
dunce = "1"
nucleo-matcher = "0.3"
serde_json = "1.0"
trash = "5.2.6"
waku-base = { path = "../waku-base" }
waku-drivers = { path = "../waku-drivers" }
waku-exec = { path = "../waku-exec" }
waku-git = { path = "../waku-git" }
waku-protocol = { path = "../waku-protocol" }
waku-vcs = { path = "../waku-vcs" }

[dev-dependencies]
uuid = { version = "1.18", features = ["v4"] }
