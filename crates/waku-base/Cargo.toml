[package]
name = "waku-base"
version = "0.1.0"
edition = "2024"
description = "Dependency-light leaf modules shared by Goddard's daemon-side crates"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
dunce = "1"
mdns-sd = "0.21.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
subtle = "2"
trash = "5.2.6"
url = "2"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-localization = { path = "../waku-localization" }
waku-protocol = { path = "../waku-protocol" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Threading",
] }
