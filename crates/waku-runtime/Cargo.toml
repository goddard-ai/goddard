[package]
name = "waku-runtime"
version = "0.1.0"
edition = "2024"
description = "Stable provider host: runtime-owned sessions, durable journal, and epoch-fenced control"
license = "GPL-3.0-only"

[dependencies]
crc32fast = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"
thiserror = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
