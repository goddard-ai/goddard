[package]
name = "waku-exec"
version = "0.1.0"
edition = "2024"
description = "Command execution, sandbox processes, and terminals for Goddard"
license = "GPL-3.0-only"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
parking_lot = "0.12"
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-base = { path = "../waku-base" }
waku-localization = { path = "../waku-localization" }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
