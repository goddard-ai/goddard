[package]
name = "waku-boss"
version = "0.1.0"
edition = "2024"
description = "Boss policy, durable service state, and eval runtime"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
parking_lot = "0.12"
rhai = { version = "1.26.1", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-memory-engine = { path = "../waku-memory-engine" }
waku-protocol = { path = "../waku-protocol" }
