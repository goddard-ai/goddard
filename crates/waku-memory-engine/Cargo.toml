[package]
name = "waku-memory-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "File-canonical, daemon-owned memory collections with scoped ACLs and bounded Jev eval questions"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["v4"] }
waku-protocol = { path = "../waku-protocol" }
