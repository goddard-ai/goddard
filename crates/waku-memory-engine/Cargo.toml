[package]
name = "waku-memory-engine"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Durable named memory buckets with deterministic chronological summaries"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
uuid = { version = "1.18", features = ["v4"] }
