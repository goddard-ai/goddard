[package]
name = "waku-share"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Friend-to-friend file sharing over iroh (P2P QUIC, blake3-verified)"

[dependencies]
anyhow = "1.0"
iroh = "1.0"
iroh-blobs = "0.103"
n0-future = "0.3"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }

[dev-dependencies]
tempfile = "3"
