[package]
name = "waku-agent"
version = "0.1.0"
edition = "2024"
description = "Scoped agent-to-agent control surface for Goddard tasks"
license = "GPL-3.0-only"

[[bin]]
name = "waku-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-client = { path = "../waku-client" }
waku-protocol = { path = "../waku-protocol" }
