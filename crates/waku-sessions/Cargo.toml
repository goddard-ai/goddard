[package]
name = "waku-sessions"
version = "0.1.0"
edition = "2024"
description = "Provider sessions and agent runtime for Goddard"
license = "GPL-3.0-only"

[features]
# Fixtures shared with waku-core tests; never enabled by production dependencies.
test-support = []

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
crossbeam-channel = "0.5"
dirs = "6.0"
dunce = "1"
github-copilot-sdk = { version = "1.0.14", default-features = false }
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
subtle = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
toml = "0.8"
url = "2"
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-base = { path = "../waku-base" }
waku-exec = { path = "../waku-exec" }
waku-localization = { path = "../waku-localization" }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
