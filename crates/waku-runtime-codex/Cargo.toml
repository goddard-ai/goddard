[package]
name = "waku-runtime-codex"
version = "0.1.0"
edition = "2024"
description = "Stable runtime ownership of the original Codex app-server connection"
license = "GPL-3.0-only"

[dependencies]
parking_lot = "0.12"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-runtime = { path = "../waku-runtime" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
