[package]
name = "waku-server"
version = "0.1.0"
edition = "2024"
description = "Daemon transport, event replay, and request dispatch for Goddard"
license = "GPL-3.0-only"

[features]
test-support = []

[dependencies]
anyhow = "1.0"
base64 = "0.22"
crossbeam-channel = "0.5"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
uuid = { version = "1.18", features = ["v4", "v7", "serde"] }
waku-base = { path = "../waku-base" }
waku-drivers = { path = "../waku-drivers" }
waku-exec = { path = "../waku-exec" }
waku-protocol = { path = "../waku-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
waku-client = { path = "../waku-client" }
