[package]
name = "waku-maintenance"
version = "0.1.0"
edition = "2024"
description = "Native host observations and cooperative maintenance scheduling for Goddard clients and daemons"
license = "GPL-3.0-only"

[dependencies]
crossbeam-channel = "0.5"
dirs = "6.0"
parking_lot = "0.12"

[dev-dependencies]
uuid = { version = "1.18", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
