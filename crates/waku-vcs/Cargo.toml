[package]
name = "waku-vcs"
version = "0.1.0"
edition = "2024"
description = "GitHub, repository, sync, and review services for Goddard"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dunce = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
waku-exec = { path = "../waku-exec" }
waku-git = { path = "../waku-git" }
waku-protocol = { path = "../waku-protocol" }
waku-sessions = { path = "../waku-sessions" }
waku-share = { path = "../waku-share" }
